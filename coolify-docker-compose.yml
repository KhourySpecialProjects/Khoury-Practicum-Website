services:
  web:
    build: .
    container_name: practicum-site
    restart: unless-stopped #allows site to redeploy if crash
    expose:
      - "3000" #remove ports allow expose

    environment:
      - NODE_ENV=production  #ensure in production mode
      - PORT=3000            #open production port
      
    healthcheck:  #lets coolify know when the container is ready to receive traffic
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      
    command: sh -c "npm run build && npm start"  #changed for production
